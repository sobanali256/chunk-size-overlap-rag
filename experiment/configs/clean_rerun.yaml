# Frozen configuration for the clean re-run. See ../EXPERIMENT_PROTOCOL.md.
# Changing anything below after the fresh results are inspected makes the analysis exploratory.
protocol_version: "1.0"

dataset:
  name: QASPER v0.3
  file: ../data/qasper_raw/qasper-dev-v0.3.json        # relative to this experiment/ folder
  file_sha256: null                                     # filled and checked by `manifest` stage
  split_used: dev                                       # QASPER's own split name; we do not train
  pilot:                                                # papers excluded from the fresh sample
    eval_file: ../eval.jsonl
    replay: {n_papers: 40, seed: 0}                     # prepare_qasper.py draw, incl. skipped papers
  max_questions_per_paper: 5                            # pilot rule
  sample:
    n_papers: 100
    seed: 20261017
    procedure: "sorted(eligible unused paper ids) -> random.Random(seed).shuffle -> first n_papers"

tokenizer:
  id: nomic-ai/nomic-embed-text-v1.5                    # same repo + revision as the model
  revision: e9b6763023c676ca8431644204f50c2b100d9aab
  add_special_tokens_for_chunking: false

embedding:
  id: nomic-ai/nomic-embed-text-v1.5
  revision: e9b6763023c676ca8431644204f50c2b100d9aab
  code_revision: 7710840340a098cfb869c4f65e87cf2b1b70caca   # nomic-ai/nomic-bert-2048 remote code
  max_seq_length: 8192
  dimension: 768                                         # full dimension, no Matryoshka truncation
  normalize: true
  doc_prefix: "search_document: "
  query_prefix: "search_query: "
  batch_size: 16
  device: cpu

retrieval:
  similarity: cosine (dot product of L2-normalised vectors), exact
  scope: paper                                           # each question searches only its own paper
  tie_break: chunk position (stable sort)

chunking:
  sizes: [128, 256, 512]
  overlap_pct: [0, 10, 20]
  overlap_definition: "overlap_tokens = round(size * pct / 100); stride = size - overlap_tokens"

modes:
  primary:   {type: token_budget, budget: 2048}          # K = 16 / 8 / 4
  secondary: {type: fixed_k, k: 5}

metrics:
  version: "2.0-token-positions"
  primary: complete
  secondary: [hit, ev_recall]
  diagnostic: [completable, random_hit, rr, evidence_precision_unique, redundancy,
               retrieved_tokens, retrieved_unique_tokens]

statistics:
  unit: paper
  primary_mode: primary
  primary_metric: complete
  comparisons:                                           # (A, B): test mean per-paper A - B
    - [s128_o10, s128_o0]
    - [s128_o20, s128_o0]
    - [s256_o10, s256_o0]
    - [s256_o20, s256_o0]
    - [s512_o10, s512_o0]
    - [s512_o20, s512_o0]
    - [s128_o0, s256_o0]
    - [s256_o0, s512_o0]
  test: paired sign-flip permutation test on per-paper differences, two-sided
  n_permutations: 100000
  permutation_seed: 1729
  correction: holm
  alpha: 0.05
  bootstrap: {n_resamples: 10000, seed: 2718, method: percentile, level: 0.95}
